<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">
  <title id="t">The test pyramid</title>
  <desc id="d">A pyramid in three layers. The broad base is unit tests, the middle layer is integration tests and the thin top is end-to-end tests. An arrow on the left points up with the text slower and more expensive, an arrow on the right points down with the text faster and cheaper.</desc>
  <rect width="800" height="560" fill="#ffffff"/>
  <polygon points="400,40 510.9,190 289.1,190" fill="#ffd6a5" stroke="#1f2937" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="289.1,190 510.9,190 621.7,340 178.3,340" fill="#bde0fe" stroke="#1f2937" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="178.3,340 621.7,340 740,500 60,500" fill="#b7e4c7" stroke="#1f2937" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#111827" text-anchor="middle" font-size="26" font-weight="600">
    <text x="400" y="150">E2E</text>
    <text x="400" y="274">Integration tests</text>
    <text x="400" y="430">Unit tests</text>
  </g>
  <g fill="#374151" text-anchor="middle" font-size="18">
    <text x="400" y="178">few, thin top</text>
    <text x="400" y="302">some</text>
    <text x="400" y="460">many, broad base</text>
  </g>
  <g stroke="#374151" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 430 V110 M44 130 L60 108 L76 130"/>
    <path d="M740 130 V450 M724 430 L740 452 L756 430"/>
  </g>
  <g fill="#374151" font-size="17">
    <text x="48" y="80" text-anchor="start">slower, more expensive</text>
    <text x="752" y="80" text-anchor="end">faster, cheaper</text>
  </g>
</svg>
