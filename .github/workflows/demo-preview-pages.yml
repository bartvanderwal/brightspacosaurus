# Publishes the Docusaurus preview of the demo course to GitHub Pages (#33):
# https://bartvanderwal.github.io/brightspacosaurus/
#
# Runs the fast checks first and deploys only when they pass. Diagrams are
# rendered by a Kroki service container with its Mermaid companion, not by the
# public kroki.io, which sometimes answers 500. If the build fails, the
# previous deployment stays online.
name: Demo preview on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      kroki:
        image: yuzutech/kroki:0.32.1
        ports:
          - 8000:8000
        env:
          KROKI_MERMAID_HOST: mermaid
      mermaid:
        image: yuzutech/kroki-mermaid:0.32.1
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo-course-docs/package-lock.json

      # The Docusaurus config loads BSO modules from src/, whose npm imports
      # (remark-kroki-a11y, unified, ...) Node resolves from ./node_modules.
      - name: Install BSO npm dependencies into node_modules
        run: deno install --node-modules-dir=auto

      - name: Lint code and course Markdown
        run: |
          deno lint
          deno task lint:demo

      - name: Fast tests (without pandoc PDFs)
        run: deno task test:fast

      - name: Voortgangsverkenner files for the preview
        run: deno run --config deno.json --allow-read --allow-write=build demo-course-docs/write-dashboard-static.ts build/preview-static

      - name: Install Docusaurus
        working-directory: demo-course-docs
        run: npm ci

      - name: Wait for Kroki (PlantUML and Mermaid)
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf -X POST -H "Content-Type: text/plain" --data 'graph TD; A-->B' http://localhost:8000/mermaid/svg > /dev/null; then
              echo "Kroki with Mermaid is ready."; exit 0
            fi
            sleep 2
          done
          echo "Kroki did not become ready."; exit 1

      - name: Build the preview
        working-directory: demo-course-docs
        env:
          DOCS_URL: https://bartvanderwal.github.io
          DOCS_BASE_URL: /brightspacosaurus/
          BSO_KROKI_URL: http://localhost:8000
        run: |
          export BSO_PREVIEW_STATIC_DIR="$GITHUB_WORKSPACE/build/preview-static"
          npx docusaurus build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo-course-docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
